[package]
name = "repohub"
version = "0.1.3"
description = "RepoHub — lightweight GitHub project dashboard"
authors = ["duserzym"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
# staticlib/cdylib are required for the iOS (and Android) builds
name = "repohub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS keychain (macOS/iOS Keychain, Windows Credential Manager) for the GitHub token
keyring = { version = "3", features = ["apple-native", "windows-native"] }

# In-app updates (desktop only; iOS updates come from the App Store / TestFlight)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
