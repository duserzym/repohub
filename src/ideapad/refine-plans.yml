name: refine-plans

# Daily: find new or changed ideas, search for related projects and write/refine plans.
on:
  schedule:
    - cron: "17 11 * * *" # every day, early morning US Central
  workflow_dispatch:
    inputs:
      force:
        description: "Re-plan every idea, even unchanged ones"
        type: boolean
        default: false
      only:
        description: "Only this idea (file name without .md)"
        type: string
        default: ""

permissions:
  contents: write
  models: read # lets GITHUB_TOKEN call GitHub Models

concurrency:
  group: refine-plans
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Refine plans
        run: node scripts/refine.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.MODEL }}
          FORCE: ${{ inputs.force }}
          ONLY: ${{ inputs.only }}
      - name: Commit plans
        if: always()
        run: |
          git config user.name "repohub-planner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plans README.md
          git diff --cached --quiet && exit 0
          git commit -m "Refine plans ($(date -u +%Y-%m-%d))"
          git pull --rebase --quiet   # ideas may have been edited in RepoHub meanwhile
          git push
